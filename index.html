<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WaterLeak Multi Check System</title>
    <link rel="stylesheet" href="./styles.css?v=20260519-estimate-live-total-b" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      window.addEventListener("error", function (event) {
        var app = document.getElementById("app");
        if (app && !app.innerHTML) {
          app.innerHTML = "<pre style=\"padding:16px;white-space:pre-wrap;color:#b91c1c;\">앱 실행 오류: " + event.message + "</pre>";
        }
      });
      window.addEventListener("unhandledrejection", function (event) {
        var app = document.getElementById("app");
        if (app && !app.innerHTML) {
          app.innerHTML = "<pre style=\"padding:16px;white-space:pre-wrap;color:#b91c1c;\">앱 실행 오류: " + (event.reason && event.reason.message ? event.reason.message : event.reason) + "</pre>";
        }
      });
    </script>
    <script src="./app.js?v=20260519-estimate-live-total-b"></script>
  </body>
</html>
